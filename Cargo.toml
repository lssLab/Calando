[package]
name = "memory-supervisor"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Cross-platform memory supervision for Claude Code and Codex CLI or Desktop App sessions"
repository = "https://github.com/lssLab/Calando"
homepage = "https://github.com/lssLab/Calando"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
